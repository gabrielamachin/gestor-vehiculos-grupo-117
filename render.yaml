databases:
  - name: gestor-vehiculos-db
    databaseName: gestor_vehiculos
    plan: free

services:
  - type: web
    name: gestor-vehiculos-api
    runtime: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    preDeployCommand: cd backend && python -m scripts.inicializar_bd
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/db
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: gestor-vehiculos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: 60
      - key: CORS_ORIGINS
        value: https://gestor-vehiculos-web.onrender.com
      - key: COOKIE_SECURE
        value: true

  - type: static
    name: gestor-vehiculos-web
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: /api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://gestor-vehiculos-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
