name: "CI: pruebas automatizadas"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: "Frontend: análisis estático y compilación"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Analizar código (lint)
        run: npm run lint

      - name: Compilar frontend
        run: npm run build

  backend-and-e2e:
    name: Pruebas del backend y de interfaz (Playwright E2E)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestor_vehiculos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gestor_vehiculos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias del backend
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Ejecutar pruebas del backend
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestor_vehiculos_test
        run: python -m pytest

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar navegador para Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E de interfaz (Playwright)
        working-directory: frontend
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestor_vehiculos_test
          E2E_PYTHON: python
        run: npm run test:e2e

      - name: Guardar informe de Playwright si hay fallos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
